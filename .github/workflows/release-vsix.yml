name: Release VSIX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build VSIX
        run: npm run package

      - name: Read extension version
        id: metadata
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Built Coding Harness v${VERSION} from ${GITHUB_SHA}"

      - name: Upload VSIX build artifact
        uses: actions/upload-artifact@v4
        with:
          name: coding-harness-v${{ steps.metadata.outputs.version }}-${{ github.sha }}
          path: coding-harness.vsix
          if-no-files-found: error

      # Never replace an existing version/tag: the artifact above is still
      # available for every successful build, even without a version bump.
      - name: Check whether this version can be released
        if: github.ref == 'refs/heads/main'
        id: release_check
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          TAG="v${VERSION}"
          EXISTING="$(git ls-remote --tags origin "refs/tags/${TAG}")"
          if [ -n "$EXISTING" ]; then
            echo "::warning::Tag ${TAG} already exists; leaving the existing release unchanged. The VSIX is available as a workflow artifact. Increment package.json for a new release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main' && steps.release_check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            coding-harness.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Coding Harness v${VERSION}" \
            --generate-notes
